<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Safari Island</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Luckiest+Guy&display=swap">
<link rel="stylesheet" href="shared/scene.css">
<link rel="stylesheet" href="shared/hub.css">
<style>
/* Option B — Safari Island: one illustrated island seen from above. Each place sits where it belongs in
   nature; tap it and Sam travels there, then the map zooms in. Map units are 1600 x 1100; sizes in cqw = 1% of map width. */
body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; background: #3fa9d8; }

.wrap { position: relative; display: flex; overflow: auto; container-type: size; overscroll-behavior: contain; scrollbar-width: thin; }
.map {
  position: relative; flex: none; margin: auto;
  width: max(900px, calc(100cqh * 16 / 11)); aspect-ratio: 16 / 11;
  container-type: inline-size;
  transform-origin: var(--ox, 50%) var(--oy, 50%);
  transition: transform .85s cubic-bezier(.55, 0, .35, 1), filter .85s;
}
.map.zoom { transform: scale(2.8); filter: saturate(1.2) brightness(1.08); }
.map > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.spot { position: absolute; left: calc(var(--x) / 16 * 1%); top: calc(var(--y) / 11 * 1%); }

.decor { transform: translate(-50%, -50%); font-family: var(--ss-font-emoji); line-height: 1; font-size: calc(var(--s) * 1cqw); pointer-events: none; user-select: none; }
.decor.drift { animation: ss-drift 9s ease-in-out infinite alternate; }

.title-scroll {
  transform: translate(-50%, -50%); padding: 1cqw 3cqw .7cqw; white-space: nowrap;
  font: 400 3.2cqw/1 var(--ss-font-display); letter-spacing: .05em; color: var(--ss-ink);
  background: var(--ss-paper); border: .3cqw solid var(--ss-ink); border-radius: .8cqw;
  box-shadow: 0 .4cqw 0 rgba(0, 0, 0, .2); pointer-events: none;
}

.pin {
  transform: translate(-50%, -32%); z-index: 3;
  display: flex; flex-direction: column; align-items: center;
  margin: 0; padding: 0; border: 0; background: none; color: var(--ss-ink); font: inherit; cursor: pointer;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: opacity .3s;
}
.pin-medal {
  width: 5.2cqw; height: 5.2cqw; display: grid; place-items: center;
  font-family: var(--ss-font-emoji); font-size: 3cqw; line-height: 1;
  background: var(--peek); border: .32cqw solid var(--ss-ink); border-radius: 50%;
  box-shadow: 0 .45cqw 0 var(--hood), 0 .45cqw 0 .32cqw var(--ss-ink);
  animation: pin-bob 3.2s ease-in-out var(--d, 0s) infinite;
  transition: scale .15s;
}
@keyframes pin-bob { 50% { transform: translateY(-.35cqw); } }
.pin-name {
  margin-top: .75cqw; padding: .25em .7em .3em; white-space: nowrap;
  font: 700 max(11px, 1.2cqw)/1 var(--ss-font-body);
  background: var(--ss-paper); border: 2px solid var(--ss-ink); border-radius: 999px;
}
.pin:hover .pin-medal, .pin:focus-visible .pin-medal { scale: 1.14; }
.pin:focus-visible { outline: none; }
.pin:focus-visible .pin-name { background: var(--ss-sun); }
.map[data-only] .pin:not(.on) { opacity: .28; }

.sam-pin {
  z-index: 5; width: 4.6cqw; transform: translate(-50%, -88%); pointer-events: none;
  transition: left var(--t, .8s) ease-in-out, top var(--t, .8s) ease-in-out;
}
.sam-pin::after { content: ''; position: absolute; left: 18%; right: 18%; bottom: -.4cqw; height: 1.2cqw; border-radius: 50%; background: rgba(0, 0, 0, .25); z-index: -1; }
.sam-pin.travel .sam-svg { animation: hop .28s ease-in-out infinite alternate; }
@keyframes hop { to { transform: translateY(-1cqw) rotate(5deg); } }
.sam-pin .hub-say { left: 50%; bottom: calc(100% + .8cqw); }

.legend {
  position: fixed; z-index: 8; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(12px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; align-items: stretch; gap: 5px;
  padding: 8px; background: rgba(255, 250, 240, .94); border: 3px solid var(--ss-ink); border-radius: 18px;
}
.legend-t { padding: 0 4px; font-size: .8rem; font-weight: 700; color: #6b5a44; }
.hub-btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 6px; white-space: nowrap;
  font: 700 .9rem/1 var(--ss-font-body); color: var(--ss-ink); cursor: pointer;
  background: #fff; border: 2px solid var(--ss-ink); border-radius: 999px;
}
.hub-btn .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--hood); border: 2px solid var(--ss-ink); }
.hub-btn[aria-pressed="true"] { background: var(--hood); color: #fff; }
@media (max-width: 640px) { .legend-t { display: none; } .hub-btn .t { display: none; } .hub-btn { padding: 4px 6px; } }
@media (prefers-reduced-motion: reduce) { .map, .sam-pin { transition: none !important; } .pin-medal, .decor, .sam-pin .sam-svg { animation: none !important; } }
</style>
</head>
<body>
<header class="hub-bar">
  <a class="hub-back" href="index.html">← Options</a>
  <h1 class="hub-name">Safari Sam's Amazing World</h1>
  <span class="hub-opt">Option B · Safari Island</span>
</header>

<main class="wrap" id="wrap" aria-label="Safari Island map">
  <div class="map" id="map">
    <svg viewBox="0 0 1600 1100" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <path id="isl" d="M800 160 C1010 140 1230 190 1300 330 C1360 450 1330 560 1320 660 C1305 790 1230 920 1050 960 C900 990 720 985 580 950 C420 910 330 820 320 690 C305 560 330 410 410 300 C490 195 620 170 800 160 Z"/>
        <pattern id="waves" width="90" height="46" patternUnits="userSpaceOnUse"><path d="M5 23 q20 -14 40 0 t40 0" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="3" stroke-linecap="round"/></pattern>
        <pattern id="dunes" width="60" height="30" patternUnits="userSpaceOnUse"><path d="M0 22 q15 -10 30 0 t30 0" fill="none" stroke="#d6a453" stroke-width="3"/></pattern>
        <pattern id="tufts" width="44" height="44" patternUnits="userSpaceOnUse"><circle cx="10" cy="12" r="2.6" fill="#78b955"/><circle cx="32" cy="32" r="2.2" fill="#78b955"/></pattern>
        <radialGradient id="trench"><stop offset="0" stop-color="#06173a"/><stop offset=".65" stop-color="#0f3d74"/><stop offset="1" stop-color="#3fa9d8" stop-opacity="0"/></radialGradient>
      </defs>
      <rect width="1600" height="1100" fill="#3fa9d8"/>
      <rect width="1600" height="1100" fill="url(#waves)"/>
      <ellipse cx="200" cy="930" rx="250" ry="175" fill="url(#trench)"/>
      <use href="#isl" fill="#7dd3ec" stroke="#7dd3ec" stroke-width="90" stroke-linejoin="round"/>
      <use href="#isl" fill="#a8e4f3" stroke="#a8e4f3" stroke-width="36" stroke-linejoin="round"/>
      <use href="#isl" fill="#f3dda2"/>
      <use href="#isl" fill="#8fd06a" transform="translate(815 560) scale(.93) translate(-815 -560)"/>
      <use href="#isl" fill="url(#tufts)" transform="translate(815 560) scale(.93) translate(-815 -560)"/>
      <!-- faraway islets -->
      <ellipse cx="1440" cy="600" rx="92" ry="62" fill="#a8e4f3"/><ellipse cx="1440" cy="600" rx="74" ry="46" fill="#f3dda2"/><ellipse cx="1440" cy="598" rx="54" ry="30" fill="#8fd06a"/>
      <ellipse cx="1525" cy="730" rx="58" ry="40" fill="#a8e4f3"/><ellipse cx="1525" cy="730" rx="43" ry="28" fill="#f3dda2"/><ellipse cx="1525" cy="728" rx="28" ry="16" fill="#8fd06a"/>
      <!-- polar ice floe -->
      <path d="M160 120 C180 55 330 35 425 66 C490 88 480 162 405 178 C320 198 190 195 160 120 Z" fill="#f4fbff" stroke="#cfeaf8" stroke-width="12"/>
      <!-- wild lands -->
      <ellipse cx="450" cy="470" rx="100" ry="110" fill="#4f9a45"/>
      <ellipse cx="500" cy="800" rx="105" ry="92" fill="#2f8a4a"/>
      <ellipse cx="1190" cy="470" rx="105" ry="98" fill="#e2c868"/>
      <ellipse cx="1170" cy="820" rx="105" ry="88" fill="#f0cf86"/>
      <ellipse cx="1170" cy="820" rx="105" ry="88" fill="url(#dunes)"/>
      <!-- mountains and the cave -->
      <polygon points="560,385 630,282 700,385" fill="#958a82"/>
      <path d="M606 385 Q630 330 654 385 Z" fill="#2b2118"/>
      <polygon points="690,392 790,232 890,392" fill="#a0958c"/><polygon points="790,232 766,270 814,270" fill="#fff"/>
      <polygon points="820,398 950,190 1080,398" fill="#8b8079"/><polygon points="950,190 918,242 982,242" fill="#fff"/>
      <polygon points="990,392 1060,272 1130,392" fill="#a39890"/><polygon points="1060,272 1042,302 1078,302" fill="#fff"/>
      <!-- hometown -->
      <rect x="575" y="410" width="480" height="335" rx="120" fill="#b9e49c" stroke="#9fd07f" stroke-width="6"/>
      <rect x="650" y="478" width="330" height="200" rx="80" fill="none" stroke="#f5e6c0" stroke-width="18"/>
      <line x1="815" y1="478" x2="815" y2="678" stroke="#f5e6c0" stroke-width="14"/>
      <circle cx="815" cy="577" r="36" fill="#f5e6c0" stroke="#e6d3a4" stroke-width="4"/>
      <!-- lake and river to the sea -->
      <path d="M815 900 C803 940 832 972 818 1012" stroke="#5cc0e6" stroke-width="22" fill="none" stroke-linecap="round"/>
      <ellipse cx="815" cy="865" rx="80" ry="46" fill="#5cc0e6" stroke="#3fa0cf" stroke-width="4"/>
      <!-- launch pad and the dig site -->
      <circle cx="1190" cy="300" r="42" fill="#d4d4dc" stroke="#8a8a96" stroke-width="6"/>
      <ellipse cx="400" cy="652" rx="44" ry="24" fill="#5a3d24" stroke="#3b2716" stroke-width="4"/>
    </svg>
  </div>
</main>

<div class="legend" id="legend" aria-label="Show one neighbourhood"><span class="legend-t">Neighbourhoods</span></div>

<script src="shared/worlds.js"></script>
<script src="shared/facts.js"></script>
<script src="shared/scene.js"></script>
<script>
(function () {
  const { hoods, worlds } = window.SAFARI;
  const wrap = document.getElementById('wrap');
  const map = document.getElementById('map');
  const legend = document.getElementById('legend');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // Where each place sits on the island (map units, 1600 x 1100).
  const SPOTS = {
    home: [655, 465], garden: [815, 455], greenhouse: [975, 465],
    farm: [655, 690], park: [815, 705], zoo: [975, 690],
    forest: [450, 470], jungle: [500, 800], savanna: [1190, 470], desert: [1170, 820],
    mountains: [950, 315], polar: [300, 112], islands: [1440, 598],
    pond: [815, 862], reef: [1030, 1022], ocean: [165, 500], deep: [200, 925],
    sky: [1440, 140], night: [630, 300], underground: [400, 650], space: [1190, 298]
  };
  const PLAZA = [815, 600];
  const DECOR = [
    ['🌲', 395, 425, 2.8], ['🌲', 505, 410, 3.2], ['🌲', 520, 530, 2.6], ['🌲', 395, 530, 2.4],
    ['🌴', 440, 760, 3], ['🌴', 565, 765, 2.8], ['🌴', 450, 860, 3.2], ['🌴', 560, 860, 2.6],
    ['🦒', 1255, 520, 2.8], ['🌳', 1120, 420, 2.4], ['🌳', 1265, 420, 2],
    ['🌵', 1100, 790, 2.4], ['🌵', 1240, 860, 2.2], ['🐪', 1235, 780, 2.2],
    ['🐋', 265, 410, 3.4], ['🐬', 120, 680, 2.4], ['⛵', 1320, 1035, 2.8], ['⛵', 640, 1050, 2],
    ['🪸', 960, 1040, 2], ['🪸', 1105, 1030, 1.8], ['🧭', 1530, 1030, 3.6], ['🧊', 405, 118, 2],
    ['☁️', 1350, 92, 3.6, 'drift'], ['☁️', 1530, 190, 2.8, 'drift'], ['☁️', 120, 260, 2.6, 'drift'],
    ['🌴', 1410, 575, 2], ['🌴', 1530, 715, 1.4], ['⛲', 815, 556, 2.2]
  ];

  const node = (tag, cls, inner, vars) => {
    const n = document.createElement(tag);
    n.className = cls;
    if (inner != null) n.innerHTML = inner;
    for (const k in vars || {}) n.style.setProperty('--' + k, vars[k]);
    return n;
  };

  map.append(node('div', 'spot title-scroll', 'Safari Island', { x: 800, y: 70 }));
  DECOR.forEach(([e, x, y, s, cls]) => map.append(node('span', 'spot decor' + (cls ? ' ' + cls : ''), e, { x, y, s })));

  // ---- pins ----
  const pins = worlds.map((w, i) => {
    const hood = hoods.find((h) => h.id === w.hood);
    const [x, y] = SPOTS[w.id];
    const p = node('button', 'spot pin', `<span class="pin-medal" aria-hidden="true">${w.icon}</span><span class="pin-name">${w.id === 'greenhouse' ? 'Greenhouse' : w.name}</span>`,
      { x, y, hood: hood.color, peek: w.peek, d: (-(i * 0.37) % 3).toFixed(2) + 's' });
    p.type = 'button';
    p.dataset.hood = w.hood;
    p.setAttribute('aria-label', 'Go to the ' + w.name);
    p.addEventListener('click', () => go(w, x, y));
    map.append(p);
    return p;
  });

  // ---- Sam ----
  const sam = node('div', 'spot sam-pin', window.SafariScene.sam() + '<div class="hub-say" aria-live="polite"></div>', { x: PLAZA[0], y: PLAZA[1] + 40 });
  map.append(sam);
  let here = [PLAZA[0], PLAZA[1] + 40];
  const bubble = sam.querySelector('.hub-say');
  let sayT;
  const say = (t, ms) => {
    bubble.textContent = t;
    bubble.classList.add('show');
    clearTimeout(sayT);
    sayT = setTimeout(() => bubble.classList.remove('show'), ms || 4000);
  };

  // Start with the town in the middle of the screen (matters on phones, where the map is wider than the screen).
  const centreOn = (x, y, smooth) => wrap.scrollTo({
    left: map.offsetLeft + x / 1600 * map.clientWidth - wrap.clientWidth / 2,
    top: map.offsetTop + y / 1100 * map.clientHeight - wrap.clientHeight / 2,
    behavior: smooth && !reduce ? 'smooth' : 'auto'
  });
  centreOn(PLAZA[0], PLAZA[1], false);
  setTimeout(() => say('Hi, I’m Safari Sam! Where shall we explore? Tap a place on the island.', 6500), 500);

  // ---- going somewhere ----
  let busy = false;
  function go(w, x, y) {
    if (busy || window.SafariScene.isOpen()) return;
    busy = true;
    bubble.classList.remove('show');
    const to = [x + 46, y + 70];
    const dist = Math.hypot(to[0] - here[0], to[1] - here[1]);
    const ms = reduce ? 0 : Math.min(1300, 250 + dist * 1.1);
    sam.style.setProperty('--t', ms + 'ms');
    sam.classList.toggle('travel', ms > 0);
    sam.style.setProperty('--x', to[0]);
    sam.style.setProperty('--y', to[1]);
    here = to;
    centreOn(x, y, true);
    setTimeout(() => {
      sam.classList.remove('travel');
      map.style.setProperty('--ox', (x / 16) + '%');
      map.style.setProperty('--oy', (y / 11) + '%');
      map.classList.add('zoom');
      setTimeout(() => window.SafariScene.open(w.id, {
        onClose: () => {
          map.classList.remove('zoom');
          busy = false;
          setTimeout(() => say('Where to next?', 2600), reduce ? 0 : 700);
        }
      }), reduce ? 0 : 650);
    }, ms);
  }

  // ---- neighbourhood legend: highlight one group of places ----
  const chips = [{ id: '', name: 'All', color: '#2b2118' }].concat(hoods).map((h) => {
    const b = node('button', 'hub-btn', (h.id ? '<span class="dot" aria-hidden="true"></span>' : '') + `<span class="t">${h.name}</span>`, { hood: h.color });
    if (!h.id) b.querySelector('.t').classList.remove('t');
    b.type = 'button';
    b.setAttribute('aria-pressed', h.id ? 'false' : 'true');
    b.setAttribute('aria-label', h.id ? 'Show ' + h.name : 'Show all places');
    b.addEventListener('click', () => {
      chips.forEach((c) => c.setAttribute('aria-pressed', c === b ? 'true' : 'false'));
      if (h.id) map.dataset.only = h.id; else delete map.dataset.only;
      pins.forEach((p) => p.classList.toggle('on', p.dataset.hood === h.id));
    });
    legend.append(b);
    return b;
  });
})();
</script>
</body>
</html>
